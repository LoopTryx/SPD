name: Feature request
description: Propose a focused improvement to SPD
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the user experience and any alternatives.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How could we verify it works?
      description: Include test conditions and tradeoffs where relevant.
